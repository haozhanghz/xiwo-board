name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION"
            exit 1
          fi
          ZIP="XiwoBoard-$VERSION-arm64.zip"
          # ditto keeps the bundle layout and code signature intact.
          ditto -c -k --keepParent build/XiwoBoard.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: XiwoBoard-arm64
          path: XiwoBoard-*-arm64.zip*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: XiwoBoard-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" XiwoBoard-*-arm64.zip XiwoBoard-*-arm64.zip.sha256 \
            --title "XiwoBoard ${GITHUB_REF_NAME#v}" "${ARGS[@]}"
